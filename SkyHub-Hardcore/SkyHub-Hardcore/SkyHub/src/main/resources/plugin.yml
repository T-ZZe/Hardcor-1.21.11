name: SkyHub
version: '${project.version}'
main: fr.skyhub.SkyHubPlugin
api-version: '1.21.11'
description: Hub dans une sphère noire (monde void) avec des mobs de téléportation.
commands:
  hub:
    description: Retourner au hub
    aliases: [lobby]
    permission: skyhub.hub
  l:
    description: "/l = retour au hub. /l sp <nom> = poser un mob (admin). /l reload = recharger (admin)."
    aliases: [skyhub]
  kit:
    description: Kits du FFA
    usage: /kit [1|2|3|set <1|2|3>|create]
  unban:
    description: Debannir un joueur (ou tous les bans temporaires)
    usage: /unban <pseudo|all>
    permission: hardcore.admin
  hardcore:
    description: Ouvre le menu Hardcore
    aliases: [hardcor]
    usage: /hardcore
    permission: hardcore.admin
permissions:
  hardcore.admin:
    description: Commandes admin hardcore
    default: op
  hardcore.bypass:
    description: Ne pas etre banni a la mort
    default: false
  skyhub.hub:
    default: true
  skyhub.build:
    description: Casser/poser des blocs dans le hub (modos)
    default: op
  skyhub.admin:
    description: Utiliser /l sp et /l reload
    default: op
