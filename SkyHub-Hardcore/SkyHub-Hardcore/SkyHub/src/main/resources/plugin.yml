name: SkyHub
version: '${project.version}'
main: fr.skyhub.SkyHubPlugin
api-version: '1.21.11'
softdepend: [CombatTagPlugin]
description: Hub dans une sphère noire (monde void) avec des mobs de téléportation.
commands:
  hub:
    description: Retourner au hub
    aliases: [lobby]
    permission: skyhub.hub
  l:
    description: "/l = retour au hub. /l sp <nom> = poser un mob (admin). /l reload = recharger (admin)."
    aliases: [skyhub]
  menu:
    description: Menu de moderation (enchantements, objets, cooldowns, PvP, equilibrage, monde)
    aliases: [enchantement, enchantment, enchlimit]
    permission: enchantlimit.admin
  kit:    description: Kits du FFA
    usage: /kit [set|load|create <zone>]
  unban:
    description: Debannir un joueur (ou tous les bans temporaires)
    usage: /unban <pseudo|all>
    permission: hardcore.admin
  hardcore:
    description: Ouvre le menu Hardcore
    aliases: [hardcor]
    usage: /hardcore
    permission: hardcore.admin
permissions:
  enchantlimit.admin:
    description: Acces a /menu
    default: op
  enchantlimit.bypass:
    description: Ignore les limites, cooldowns, combat tag, regles de monde
    default: false
  hardcore.admin:
    description: Commandes admin hardcore
    default: op
  hardcore.bypass:
    description: Ne pas etre banni a la mort
    default: false
  skyhub.hub:
    default: true
  skyhub.build:
    description: Casser/poser des blocs dans le hub (modos)
    default: op
  skyhub.admin:
    description: Utiliser /l sp et /l reload
    default: op
